[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coreader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ebooklib>=0.18",
    "pypdf>=4.0",
    "ollama>=0.2",
    "beautifulsoup4>=4.12",
]

[project.scripts]
coreader = "coreader.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
