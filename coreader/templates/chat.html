<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Co-Reader — Session</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1a0f; color: #d0e8d0; font-family: Georgia, serif; height: 100vh; display: flex; flex-direction: column; }
    #top-bar {
      background: #0a1509; padding: 12px 24px; border-bottom: 1px solid #2a3a2a;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    #top-bar .title { color: #d4a853; font-size: 1rem; font-weight: bold; }
    #top-bar .meta { color: #5a7a5a; font-size: 0.85rem; }
    #done-btn { padding: 6px 16px; background: #1a2a1a; border: 1px solid #3a5a3a; border-radius: 4px; color: #d0e8d0; font-size: 0.85rem; cursor: pointer; }
    #done-btn:hover { background: #2a3a2a; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .msg { max-width: 75%; line-height: 1.7; font-size: 0.95rem; white-space: pre-wrap; }
    .msg.assistant { background: #152018; border-radius: 0 8px 8px 8px; padding: 14px 18px; color: #d0e8d0; align-self: flex-start; }
    .msg.user { background: #1e3a1e; border-radius: 8px 0 8px 8px; padding: 14px 18px; color: #c0dcc0; align-self: flex-end; }
    #input-area {
      padding: 16px 24px; border-top: 1px solid #2a3a2a; background: #0a1509;
      display: flex; gap: 10px; flex-shrink: 0;
    }
    #msg-input { flex: 1; background: #152018; border: 1px solid #2a4a2a; border-radius: 6px; padding: 10px 14px; color: #d0e8d0; font-size: 0.95rem; font-family: Georgia, serif; outline: none; }
    #msg-input:focus { border-color: #4a7a4a; }
    #send-btn { padding: 10px 20px; background: #d4a853; color: #0d1a0f; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    #send-btn:hover { background: #c49743; }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div id="top-bar">
    <span class="title">{{ book["title"] if book else "Session" }}</span>
    <span class="meta">
      {% if session_type == "checkin" %}Chapter {{ chapter }} · Check-in{% else %}Cross-Book Compare{% endif %}
    </span>
    <button id="done-btn">Done</button>
  </div>

  <div id="messages">
    {% for ex in exchanges %}
    <div class="msg {{ ex.role }}">{{ ex.content }}</div>
    {% endfor %}
  </div>

  <div id="input-area">
    <input id="msg-input" type="text" placeholder="Your response..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

  <script>
    const SESSION_ID = {{ session_id }};
    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('msg-input');
    const messages = document.getElementById('messages');

    messages.scrollTop = messages.scrollHeight;

    async function sendMessage() {
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      sendBtn.disabled = true;

      appendMessage('user', content);

      const res = await fetch(`/session/${SESSION_ID}/message`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content}),
      });
      const data = await res.json();
      appendMessage('assistant', data.content);
      sendBtn.disabled = false;
      input.focus();
    }

    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      messages.appendChild(div);
      div.scrollIntoView({behavior: 'smooth'});
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    document.getElementById('done-btn').addEventListener('click', async () => {
      sendBtn.disabled = true;
      document.getElementById('done-btn').textContent = 'Saving...';
      await fetch(`/session/${SESSION_ID}/done`, {method: 'POST'});
      window.location.href = '/';
    });
  </script>
</body>
</html>
